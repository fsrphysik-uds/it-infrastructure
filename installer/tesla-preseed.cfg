#_preseed_V1
# Debian 13 (Trixie) — FSR desktop "tesla"
# WARNING: Automatically repartitions and formats /dev/sda.

### Localization
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de

### Network configuration
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 134.96.1.75
d-i netcfg/get_netmask string 255.255.255.248
d-i netcfg/get_gateway string 134.96.1.73
d-i netcfg/get_nameservers string 9.9.9.9 149.112.112.112
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string tesla
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string stable 

### Account setup
d-i passwd/root-login boolean false
d-i passwd/user-fullname string FSR Admin
d-i passwd/username string fsradmin
# Password is intentionally not preseeded: enter it interactively.

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

### Partitioning — DESTROYS EXISTING DATA ON /dev/sda
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/choose_recipe select desktop

# ~1 GiB EFI system partition; remainder ext4 mounted at /; no swap.
# partman recipe sizes are in decimal MB, so 1074 MB is approximately 1 GiB.
d-i partman-auto/expert_recipe string                  \
    desktop ::                                         \
        1074 1074 1074 free                            \
            $primary{ }                                \
            $iflabel{ gpt }                            \
            method{ efi }                              \
            format{ }                                  \
        .                                              \
        1024 10000 1000000000 ext4                     \
            $primary{ }                                \
            method{ format } format{ }                 \
            use_filesystem{ } filesystem{ ext4 }       \
            label{ DEBIAN }                            \
            mountpoint{ / }                            \
        .

# In the 'no swap' warning, 'false' means do NOT go back to partitioning.
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### APT setup
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean true

### Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string ansible git python3 sudo
d-i pkgsel/upgrade select full-upgrade

### Boot loader (UEFI installation)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

### Finishing
d-i finish-install/reboot_in_progress note
